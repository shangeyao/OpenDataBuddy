<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>大数据智能体工作台 DataBuddy</title>
<link rel="stylesheet" href="/assets/styles.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230052d9'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='white' font-family='sans-serif'%3EB%3C/text%3E%3C/svg%3E" />
</head>
<body>

<!-- 登录 -->
<section id="login-screen" class="login-wrap hidden">
  <div class="login-box">
    <div class="logo-row">
      <span class="tb-logo" style="width:28px;height:28px;border-radius:6px;font-size:14px">B</span>
      <div>
        <div style="font-size:15px;font-weight:500">大数据智能体工作台</div>
        <div class="tiny dim">DataBuddy · 开源版</div>
      </div>
    </div>
    <h2>登录控制台</h2>
    <p class="sub">使用本地账号登录，无需云账号与实名认证</p>
    <form id="login-form">
      <div class="field">
        <label>邮箱 / 账号</label>
        <input type="text" name="email" value="admin@local" autocomplete="username" />
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" name="password" value="admin123" autocomplete="current-password" />
      </div>
      <p class="form-error" id="login-error"></p>
      <button class="btn primary block lg" type="submit">登 录</button>
    </form>
    <p class="login-foot">
      首次启动默认管理员：admin@local / admin123<br />
      MIT License · 数据完全落在本机
    </p>
  </div>
</section>

<!-- 控制台 -->
<div id="app" class="hidden">
  <header class="topbar">
    <div class="tb-brand">
      <span class="tb-logo">B</span>
      <span class="tb-title" id="tb-title">大数据智能体工作台</span>
    </div>
    <div class="tb-divider"></div>
    <a class="tb-link" href="#/workspaces" id="tb-console">工作空间</a>
    <a class="tb-link" href="#/buddy" id="tb-buddy">Buddy</a>
    <div class="tb-right">
      <span class="tb-region" title="本地部署，无地域概念">本地</span>
      <button class="tb-link" id="tb-docs" title="API 文档">文档</button>
      <button class="tb-link" id="tb-msg" title="通知">消息</button>
      <button class="tb-link" id="tb-help" title="帮助">帮助</button>
      <div class="tb-avatar" id="user-menu">管</div>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar">
      <div class="ws-block">
        <button class="ws-picker" id="ws-picker">
          <span class="dot" style="width:6px;height:6px;border-radius:50%;background:#2ba471"></span>
          <span class="name" id="ws-name">未选择空间</span>
          <span class="caret">▾</span>
        </button>
      </div>
      <nav class="nav" id="nav"></nav>
    </aside>

    <main class="main">
      <div class="page-head" id="page-head">
        <div class="crumb" id="crumb"></div>
        <div class="head-main">
          <div>
            <h1 id="page-title">工作空间</h1>
            <div class="desc" id="page-desc"></div>
          </div>
          <div class="head-actions" id="page-actions"></div>
        </div>
      </div>
      <div class="page-body" id="page"></div>
    </main>
  </div>
</div>

<div id="toast" class="toast hidden"></div>
<div id="modal-root"></div>

<script type="module" src="/assets/js/app.js?v=0.4.0.1"></script>
</body>
</html>
